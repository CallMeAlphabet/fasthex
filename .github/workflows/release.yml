name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: x86_64-linux-musl
            use_cross: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            suffix: aarch64-linux-musl
            use_cross: true

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: x86_64-linux-gnu
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: aarch64-linux-gnu
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-14
            suffix: x86_64-macos
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-14
            suffix: aarch64-macos
            use_cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          BIN="${{ github.event.repository.name }}"
          ARTIFACT="$BIN-${{ matrix.suffix }}"
          cp target/${{ matrix.target }}/release/$BIN ./$ARTIFACT
          if command -v sha256sum > /dev/null; then
            sha256sum $ARTIFACT > $ARTIFACT.sha256
          else
            shasum -a 256 $ARTIFACT > $ARTIFACT.sha256
          fi
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.suffix }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

  release:
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          if-no-files-found: warn

      - name: Move rolling tag
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: artifacts/*
